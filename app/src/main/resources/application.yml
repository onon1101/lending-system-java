spring:
  application:
    name: LendingSystem
  r2dbc:
    url: "${DATABASE_URL:r2dbc:postgresql://postgres.onon1101.org:5432/lending_db}"
    username: "${DB_USER:onon1101}"
    password: "${DB_PASSWORD:Fdsadfqwer123@}"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  mail:
    host: "${MAIL_HOST:192.168.1.121}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${MAIL_SMTP_AUTH:false}"
          starttls:
            enable: "${MAIL_STARTTLS:false}"
  data:
    redis:
      url: "${REDIS_URL:redis://redis.onon1101.org:6379}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:2s}"
      timeout: "${REDIS_COMMAND_TIMEOUT:2s}"
      database: "${REDIS_DATABASE:0}"

logging:
  level:
    root: INFO
    onon1101.lendingsystem: DEBUG
    org.springframework: WARN
  file:
    name: logs/lending-system.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: when-authorized
      probes:
        enabled: true

lending:
  minio:
    enabled: "${MINIO_HEALTH_ENABLED:false}"
    endpoint: "${MINIO_ENDPOINT:http://rustfs.onon1101.org:9000}"
    access-key: "${MINIO_ACCESS_KEY:minioadmin}"
    secret-key: "${MINIO_SECRET_KEY:minioadmin}"
    bucket: "${MINIO_BUCKET_NAME:lending-system}"
  video-downloader:
    enabled: "${VIDEO_HEALTH_ENABLED:false}"
    target: "${VIDEO_SERVICE_ADDR:localhost:50051}"
  jwt:
    secret: "${JWT_SECRET:development-secret-key-at-least-32-bytes}"
  access-token:
    issuer: lending-system-access-token
    expiration: PT15M
  refresh-token:
    expiration: "${REFRESH_TOKEN_EXPIRATION:PT1H}"
  user-cache:
    ttl: "${USER_CACHE_TTL:PT15M}"
  forgot-token:
    issuer: lending-system-forgot-password
    expiration: PT15M
  email-token:
    issuer: lending-system-email-validation
    expiration: PT24H
  audit:
    hmac-key: "${AUDIT_HMAC_KEY:development-audit-hmac-key-do-not-use-in-production}"
  email-verification:
    resend-cooldown: "${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}"

app:
  mail:
    sender: "${MAIL_SENDER:no-reply@lending-system.local}"
  reset-password-url: "${RESET_PASSWORD_URL:http://localhost:3000/reset-password}"
  email-validation-url: "${EMAIL_VALIDATION_URL:http://localhost:3000/validate-email}"
