spring.application.name=LendingSystem
logging.level.root=INFO
logging.level.onon1101.lendingsystem=DEBUG
logging.level.org.springframework=WARN
logging.file.name=logs/lending-system.log
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://192.168.1.120:5432/postgres}
spring.datasource.username=${DB_USER:lending_user}
spring.datasource.password=${DB_PASSWORD:calcal321}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
lending.minio.enabled=${MINIO_HEALTH_ENABLED:false}
lending.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
lending.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
lending.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
lending.minio.bucket=${MINIO_BUCKET_NAME:lending-system}
lending.video-downloader.enabled=${VIDEO_HEALTH_ENABLED:false}
lending.video-downloader.target=${VIDEO_SERVICE_ADDR:localhost:50051}
lending.access-token.secret=${JWT_SECRET:development-secret-key-at-least-32-bytes}
lending.access-token.issuer=lending-system-access-token
lending.access-token.expiration=PT1H
lending.forgot-token.secret=${FORGOT_PASSWORD_JWT_SECRET:development-forgot-password-secret-32-bytes}
lending.forgot-token.issuer=lending-system-forgot-password
lending.forgot-token.expiration=PT15M
lending.audit.hmac-key=${AUDIT_HMAC_KEY:development-audit-hmac-key-do-not-use-in-production}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.sender=${MAIL_SENDER:no-reply@lending-system.local}
app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
