spring.datasource.url=jdbc:h2:mem:lending_system;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# API documentation is not part of integration-test behavior. Disabling it removes startup work
# and the SpringDoc warning that these endpoints are enabled by default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

lending.minio.enabled=false
lending.video-downloader.enabled=false
lending.jwt.secret=test-secret-key-that-is-at-least-32-bytes
lending.jwt.issuer=lending-system-test
lending.jwt.expiration=PT1H
